<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - University Network</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-card: #161b22;
      --text-primary: #c9d1d9;
      --text-accent: #58a6ff;
      --border-color: #30363d;
      --success-color: #2ea44f;
      --danger-color: #f85149;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 600px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h1 {
      color: var(--text-accent);
      font-size: 24px;
      margin-top: 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .status-healthy {
      background-color: rgba(46, 164, 79, 0.15);
      color: #3fb950;
    }
    .status-unhealthy {
      background-color: rgba(248, 81, 73, 0.15);
      color: #ff7b72;
    }
    .btn {
      background-color: #21262d;
      color: var(--text-accent);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #30363d;
    }
    .data-panel {
      margin-top: 20px;
      background-color: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
    }
    .info {
      font-size: 14px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Portal</h1>
    <div class="info">Welcome to the University Student Portal. Authenticated requests are forwarded securely.</div>
    <div>
      <span id="healthStatus" class="status-badge status-healthy">Checking Health...</span>
    </div>
    <button id="fetchBtn" class="btn">View My Profile Data</button>
    <div id="resultPanel" class="data-panel">Click the button to query student record details from backend API...</div>
  </div>

  <script>
    async function checkHealth() {
      const badge = document.getElementById('healthStatus');
      try {
        const res = await fetch('/health');
        const data = await res.json();
        if (res.ok) {
          badge.textContent = 'SYSTEM ACTIVE';
          badge.className = 'status-badge status-healthy';
        } else {
          badge.textContent = 'DATABASE DISCONNECTED';
          badge.className = 'status-badge status-unhealthy';
        }
      } catch (err) {
        badge.textContent = 'OFFLINE';
        badge.className = 'status-badge status-unhealthy';
      }
    }

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const panel = document.getElementById('resultPanel');
      panel.textContent = 'Requesting data...';
      try {
        const res = await fetch('/api/students');
        const data = await res.json();
        if (data.success) {
          panel.textContent = JSON.stringify(data.data, null, 2);
        } else {
          panel.textContent = `API Error: ${data.error}`;
        }
      } catch (err) {
        panel.textContent = `Network Error: ${err.message}`;
      }
    });

    // Check health immediately and every 5 seconds
    checkHealth();
    setInterval(checkHealth, 5000);
  </script>
</body>
</html>
