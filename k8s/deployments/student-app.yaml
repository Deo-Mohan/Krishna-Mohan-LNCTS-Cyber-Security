apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
  namespace: student
  labels:
    app: student-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      serviceAccountName: student-app-sa
      automountServiceAccountToken: false
      containers:
        - name: portal
          image: student-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8081"
            - name: DB_HOST
              value: "student-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "student_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: db-password
            - name: DB_NAME
              value: "student_db"
            - name: STRICT_DB_CHECK
              value: "true"
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
